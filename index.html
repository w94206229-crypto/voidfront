 constructor(){this.page='solo';this.modalCallback=null;this.profile={name:'\u6307\u6325\u5b98 '+Math.floor(10+Math.random()*90),race:'terran'};this.settings={edgeScroll:true,sound:true};this.netOptions={mode:location.protocol==='file:'?'manual':'ws',url:location.protocol==='file:'?'':`${location.protocol==='https:'?'wss':'ws'}://${location.host}/signal`,stun:'stun:stun.l.google.com:19302',turn:'',username:'',credential:''};try{const saved=JSON.parse(localStorage.getItem('voidfront-v2')||'{}');Object.assign(this.profile,saved.profile||{});Object.assign(this.settings,saved.settings||{})}catch{}this.config={mission:'skirmish',rules:'ffa',difficulty:'normal',holdMinutes:25,enemyRace:'zerg'};this.soloBots=1;this.net=null;this.session=null;this.lobby=null;this.logs=[];this.roomChat=[];this.loaded=new Map();this.pendingStart=false;this.slotDefaults=()=>[0,1,2,3].map(id=>({id,kind:id===0?'human':id===1?'bot':'open',name:id===0?this.profile.name:`BOT ${id}`,race:id===0?this.profile.race:['terran','zerg','protoss','terran'][id],ready:id===0}));this.root=document.getElementById('app');this.modalRoot=document.getElementById('modalRoot');document.addEventListener('click',e=>this.click(e));document.addEventListener('change',e=>this.change(e));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!this.modalHidden()){e.preventDefault();this.closeModal()}});this.render();this.roomTimer=setInterval(()=>this.roomStatus(),1000)}
 save(){try{localStorage.setItem('voidfront-v2',JSON.stringify({profile:this.profile,settings:this.settings}))}catch{}}
 toast(text,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=String(text);document.getElementById('toasts').appendChild(el);while(document.getElementById('toasts').children.length>5)document.getElementById('toasts').firstChild.remove();setTimeout(()=>el.remove(),error?7000:3600)}
 log(text){this.logs.push(new Date().toLocaleTimeString()+' '+text);if(this.logs.length>30)this.logs.shift();this.roomStatus()}
 modalHidden(){return this.modalRoot.classList.contains('hidden')}
 modal(title,body,actions='',wide=false){this.modalRoot.innerHTML=`<section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${safeText(title)}"><div class="modal-head"><h2>${safeText(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="\u5173\u95ed">&times;</button></div>${body}${actions?`<div class="modal-actions">${actions}</div>`:''}</section>`;this.modalRoot.classList.remove('hidden');this.modalRoot.querySelector('button,input,textarea')?.focus();}
 closeModal(){this.modalRoot.classList.add('hidden');this.modalRoot.innerHTML='';if(this.session&&!this.session.world.net)this.session.paused=false;this.session?.input?.clearKeys()}
 render(){if(this.session)return;this.root.innerHTML=`<div class="workspace"><aside class="sidebar"><div class="brand">${BRAND_MARK}<div class="brand-name">VOIDFRONT<small>COMMAND NETWORK</small></div></div><div class="side-label">OPERATIONS</div>${[['solo','01','\u5355\u4eba\u884c\u52a8'],['network','02','\u8054\u673a\u5927\u5385'],['guide','03','\u4f5c\u6218\u624b\u518c'],['codex','04','\u5355\u4f4d\u56fe\u9274']].map(([id,n,label])=>`<button class="nav-item ${(this.page===id||this.page==='room'&&id==='network')?'active':''}" data-action="nav" data-page="${id}"><span class="nav-icon">${n}</span><span class="nav-text">${label}</span></button>`).join('')}<div class="side-bottom"><span class="online-dot"></span>ALL SYSTEMS NOMINAL<br><span class="mono">BUILD ${VERSION} / WEBRTC</span><br><br>\u4e09\u65cf\u4e89\u950b\u3002\u56db\u65b9\u76f4\u8fde\u3002<br>\u6bcf\u4e00\u4e2a\u6307\u4ee4\uff0c\u76f4\u8fbe\u6218\u573a\u3002</div></aside><main class="content"><div class="content-inner" id="pageContent"></div></main></div>`;const area=document.getElementById('pageContent');if(this.page==='solo')area.innerHTML=this.soloPage();else if(this.page==='network')area.innerHTML=this.networkPage();else if(this.page==='room')area.innerHTML=this.roomPage();else if(this.page==='guide')area.innerHTML=this.guidePage();else area.innerHTML=this.codexPage();this.roomStatus()}
 title(eyebrow,title,sub,badge='1\u20134 COMMANDERS'){return`<div class="topline"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div><span class="badge"><i class="online-dot"></i>${badge}</span></div>`}
 missions(selected,disabled=false){return`<div class="cards">${Object.entries(MISSION_COPY).map(([id,[n,title,desc]])=>`<button class="option-card ${selected===id?'active':''}" data-action="mission" data-value="${id}" ${disabled?'disabled':''}><div class="card-index">${n}</div><span class="selected-mark"></span><h4>${title}</h4><p>${desc}</p></button>`).join('')}</div>`}
 races(){const notes={terran:'\u673a\u68b0\u5316 / \u8fdc\u7a0b\u706b\u529b',protoss:'\u80fd\u91cf\u573a / \u7075\u80fd\u79d1\u6280',zerg:'\u83cc\u6bef / \u8fdb\u5316\u866b\u7fa4'},symbols={terran:'\u22c8',protoss:'\u25c8',zerg:'\u2b21'};return`<div class="cards race-cards">${Object.keys(RACE_CONFIG).map(id=>`<button class="option-card race-card ${this.profile.race===id?'active':''}" data-action="race" data-value="${id}"><div class="race-symbol">${symbols[id]}</div><div><h4>${RACE_SHORT[id]}</h4><p>${notes[id]}</p></div></button>`).join('')}</div>`}
 soloPage(){return`${this.title('OPERATIONS / 01','\u90e8\u7f72\u4f60\u7684\u4e0b\u4e00\u573a\u80dc\u5229','\u9009\u62e9\u9635\u8425\u4e0e\u4efb\u52a1\uff0c\u5efa\u7acb\u57fa\u5730\uff0c\u638c\u63e1\u6218\u573a\u3002','OFFLINE READY')}<section class="hero"><div class="hero-copy"><div class="eyebrow">THE FRONTIER IS YOURS</div><h2>NO ORDERS.<br>JUST YOURS.</h2><p>\u4e09\u4e2a\u9635\u8425\uff0c\u4e09\u79cd\u4f5c\u6218\u65b9\u5f0f\u3002\u4ece\u5355\u4eba\u8bad\u7ec3\u5230\u56db\u4eba\u8054\u5408\u884c\u52a8\uff0c\u4f60\u7684\u90e8\u961f\u59cb\u7ec8\u7531\u4f60\u638c\u63a7\u3002</p></div>${ART_HERO}<div class="hero-meta">SECTOR 07 // VOIDFRONT</div></section><div class="section-head"><h3>01 &nbsp; \u9009\u62e9\u4f5c\u6218\u4efb\u52a1</h3><span>\u6240\u6709\u4efb\u52a1\u5747\u652f\u6301\u8054\u673a</span></div>${this.missions(this.config.mission)}<div class="section-head"><h3>02 &nbsp; \u9009\u62e9\u4f60\u7684\u9635\u8425</h3><span>\u72ec\u7acb\u79d1\u6280\u6811\u4e0e\u4f5c\u6218\u98ce\u683c</span></div>${this.races()}<div class="settings-line"><div class="field"><label>\u6307\u6325\u5b98\u547c\u53f7</label><input id="profileName" maxlength="24" value="${safeText(this.profile.name)}"></div><div class="field"><label>\u5bf9\u5c40\u89c4\u5219</label><select id="soloRules" ${this.config.mission!=='skirmish'?'disabled':''}>${this.option('ffa','\u5404\u81ea\u4e3a\u6218',this.config.rules)}${this.option('teams','2v2 \u7ec4\u961f',this.config.rules)}${this.option('coop','\u534f\u4f5c vs Bot',this.config.rules)}</select></div><div class="field"><label>Bot \u6570\u91cf</label><select id="soloBots">${[1,2,3].map(n=>this.option(String(n),`${n} \u4f4d`,String(this.soloBots))).join('')}</select></div><div class="field"><label>Bot \u96be\u5ea6</label><select id="difficulty">${this.difficultyOptions(this.config.difficulty)}</select></div>${this.config.mission==='hold'?`<div class="field"><label>\u9632\u5b88\u65f6\u95f4</label><select id="holdMinutes">${[5,10,25].map(n=>this.option(String(n),`${n} \u5206\u949f`,String(this.config.holdMinutes))).join('')}</select></div>`:''}</div><div class="launch-line"><p>\u5de6\u952e\u9009\u62e9\u3001\u53f3\u952e\u4e0b\u4ee4\u3002A \u653b\u51fb\u79fb\u52a8\uff0cB \u5efa\u9020\uff0cF1 \u57fa\u5730\u3002<br>\u4f7f\u7528\u65b9\u5411\u952e\u6216\u9f20\u6807\u4e2d\u952e\u5e73\u79fb\u955c\u5934\uff0c\u6eda\u8f6e\u7f29\u653e\u3002</p><button class="btn primary launch" data-action="solo-start">\u90e8\u7f72\u4f5c\u6218\u90e8\u961f <span class="arrow">&#8599;</span></button></div><div class="footer-note">NATIVE CANVAS / ZERO CDN DEPENDENCIES / 30 HZ SIMULATION / OWNER AUTHORITY</div>`}
 option(value,label,selected){return`<option value="${safeText(value)}" ${value===selected?'selected':''}>${label}</option>`}
 difficultyOptions(v){return this.option('easy','\u4f11\u95f2',v)+this.option('normal','\u6807\u51c6',v)+this.option('hard','\u7cbe\u82f1',v)}
 connectionConfig(){const n=this.netOptions;return`<details class="network-config" open><summary>\u8fde\u63a5\u65b9\u5f0f\u4e0e NAT \u8bbe\u7f6e</summary><div class="fields"><div class="field"><label>\u4fe1\u4ee4\u65b9\u5f0f</label><select id="netMode">${this.option('ws','\u623f\u95f4\u7801 / \u81ea\u6258\u7ba1\u4fe1\u4ee4',n.mode)}${this.option('manual','\u65e0\u4fe1\u4ee4\u670d\u52a1 / \u4ea4\u6362\u8fde\u63a5\u7801',n.mode)}${this.option('local','\u540c\u6d4f\u89c8\u5668\u591a\u6807\u7b7e\u6d4b\u8bd5',n.mode)}</select></div><div class="field"><label>\u4fe1\u4ee4 WebSocket \u5730\u5740</label><input id="netURL" value="${safeText(n.url)}" placeholder="wss://your-domain/signal" ${n.mode!=='ws'?'disabled':''}></div><div class="field"><label>STUN \u5730\u5740\uff08\u53ef\u6e05\u7a7a\u4ec5\u6d4b\u5c40\u57df\u7f51\uff09</label><input id="netSTUN" value="${safeText(n.stun)}" placeholder="stun:stun.example.com:3478"></div><div class="field"><label>TURN \u5730\u5740\uff08\u6309\u9700\u586b\u5199\uff09</label><input id="netTURN" value="${safeText(n.turn)}" placeholder="turn:turn.example.com:3478"></div><div class="field"><label>TURN \u7528\u6237\u540d</label><input id="netUser" value="${safeText(n.username)}" autocomplete="off"></div><div class="field"><label>TURN \u51ed\u8bc1\uff08\u4e0d\u4f1a\u4fdd\u5b58\u5230\u672c\u5730\uff09</label><input id="netCredential" type="password" value="${safeText(n.credential)}" autocomplete="off"></div></div></details><div class="note">${n.mode==='manual'?'\u4e0d\u9700\u8981\u90e8\u7f72\u4fe1\u4ee4\u670d\u52a1\u3002\u623f\u4e3b\u4e3a\u6bcf\u4e00\u4f4d\u65b0\u73a9\u5bb6\u751f\u6210\u9080\u8bf7\u7801\uff0c\u73a9\u5bb6\u8fd4\u56de\u5e94\u7b54\u7801\uff1b\u5176\u4f59\u8282\u70b9\u81ea\u52a8\u5efa\u7acb\u76f4\u8fde\u3002':n.mode==='local'?'\u6b64\u6a21\u5f0f\u4ec5\u7528\u4e8e\u540c\u4e00\u6d4f\u89c8\u5668\u914d\u7f6e\u4e0b\u7684\u591a\u6807\u7b7e\u6d4b\u8bd5\uff0c\u4e0d\u80fd\u7528\u6765\u8fde\u63a5\u591a\u53f0\u7535\u8111\u3002\u5bf9\u5c40\u6570\u636e\u4ecd\u901a\u8fc7\u771f\u5b9e WebRTC \u4f20\u8f93\u3002':'\u9700\u8981\u53ef\u8bbf\u95ee\u7684\u4fe1\u4ee4\u670d\u52a1\uff0c\u9879\u76ee\u5305\u5df2\u63d0\u4f9b server.py\u3002\u670d\u52a1\u53ea\u7ba1\u7406\u623f\u95f4\u4e0e\u4ea4\u6362 SDP / ICE\uff0c\u4e0d\u63a5\u6536\u6216\u8f6c\u53d1\u5bf9\u5c40\u6570\u636e\u3002'}<br>\u4e25\u683c NAT\u3001\u4f01\u4e1a\u7f51\u7edc\u6216\u8fd0\u8425\u5546\u963b\u65ad\u76f4\u8fde\u65f6\u9700\u914d\u7f6e TURN\u3002\u5b83\u53ea\u4e2d\u7ee7\u52a0\u5bc6\u6570\u636e\uff0c\u4e0d\u53c2\u4e0e\u6218\u6597\u8ba1\u7b97\u3002</div>`}
 networkPage(){return`${this.title('COMMAND NETWORK / 02','\u6ca1\u6709\u4e2d\u8f6c\u6307\u6325\u5b98','\u6700\u591a\u56db\u4f4d\u73a9\u5bb6\u5168\u4e92\u8054\u3002\u4ea4\u6218\u76f4\u8fbe\u5bf9\u624b\uff0c\u623f\u4e3b\u4ec5\u6258\u7ba1 Bot\u3002')}<div class="field" style="max-width:340px"><label>\u4f60\u7684\u6307\u6325\u5b98\u547c\u53f7</label><input id="profileName" maxlength="24" value="${safeText(this.profile.name)}"></div><div class="lobby-choice"><section class="panel"><div class="eyebrow">ESTABLISH A FRONT</div><h3>\u521b\u5efa\u4f5c\u6218\u623f\u95f4</h3><p>\u8bbe\u7f6e\u4efb\u52a1\u3001\u9635\u8425\u4e0e Bot\uff0c\u9080\u8bf7\u961f\u53cb\u6216\u5bf9\u624b\u3002\u56db\u53f0\u8bbe\u5907\u4e4b\u95f4\u5171\u5efa\u7acb\u516d\u6761\u53cc\u5411\u8fde\u63a5\u3002</p><button class="btn primary" data-action="create-room">\u521b\u5efa\u623f\u95f4 <span>&#8599;</span></button></section><section class="panel"><div class="eyebrow">JOIN THE OPERATION</div><h3>\u52a0\u5165\u4f5c\u6218\u623f\u95f4</h3><p>${this.netOptions.mode==='manual'?'\u7c98\u8d34\u623f\u4e3b\u53d1\u6765\u7684\u9080\u8bf7\u7801\uff0c\u751f\u6210\u5e94\u7b54\u540e\u53d1\u56de\u623f\u4e3b\u3002':'\u8f93\u5165\u623f\u4e3b\u5206\u4eab\u7684\u516d\u4f4d\u623f\u95f4\u7801\uff0c\u4e0e\u623f\u95f4\u5185\u6240\u6709\u73a9\u5bb6\u76f4\u8fde\u3002'}</p><div class="field">${this.netOptions.mode==='manual'?'<textarea id="joinCode" placeholder="VF2. ..." aria-label="\u9080\u8bf7\u7801" style="min-height:52px"></textarea>':'<input id="joinCode" maxlength="6" placeholder="ABC123" aria-label="\u623f\u95f4\u7801" class="mono" style="letter-spacing:4px;text-transform:uppercase">'}</div><button class="btn" data-action="join-room">\u52a0\u5165\u623f\u95f4 <span>&#8594;</span></button></section></div>${this.connectionConfig()}<div class="footer-note">NO HOST-ROUTED DAMAGE / RELIABLE EVENTS + 30 HZ SNAPSHOTS / READY-CHECKED FULL MESH</div>`}
 captureFields(){const val=id=>document.getElementById(id)?.value;if(val('profileName'))this.profile.name=val('profileName').trim().slice(0,24)||'Commander';const pairs={netMode:'mode',netURL:'url',netSTUN:'stun',netTURN:'turn',netUser:'username',netCredential:'credential'};for(const[id,key]of Object.entries(pairs))if(val(id)!==undefined)this.netOptions[key]=val(id).trim();this.save()}
 networkOptions(){this.captureFields();const n=this.netOptions,ice=[];if(n.stun)ice.push({urls:n.stun.split(',').map(s=>s.trim()).filter(Boolean)});if(n.turn)ice.push({urls:n.turn.split(',').map(s=>s.trim()).filter(Boolean),username:n.username,credential:n.credential});return{mode:n.mode,url:n.url,name:this.profile.name,ice}}
 async createRoom(){if(this.net){this.page='room';this.render();return}this.lobby={...clone(this.config),slots:this.slotDefaults(),rev:1};await this.makeNet(true)}
 async joinRoom(){const code=document.getElementById('joinCode')?.value.trim();if(!code){this.toast('\u8bf7\u5148\u8f93\u5165\u623f\u95f4\u7801\u6216\u9080\u8bf7\u7801',true);return}await this.makeNet(false,code)}
 async makeNet(host,code=''){try{const options=this.networkOptions();const net=this.net=new MeshNetwork(options);this.isCreator=host;net.on('error',msg=>this.toast(msg,true));net.on('notice',msg=>{this.log(msg);this.toast(msg)});net.on('joined',()=>{this.page='room';if(!host)this.lobby=null;this.render();this.log('ROOM '+net.room+' / P'+(net.id+1))});net.on('members',members=>this.membersChanged(members));net.on('connected',peer=>{this.log(`P${peer+1} DATA CHANNEL OPEN`);if(net.id===net.host)this.sendLobby();else if(peer===net.host)this.sendProfile();this.session?.world.sendFull(peer);this.roomStatus()});net.on('peer',(id,status)=>{this.log(`P${id+1} ${status.toUpperCase()}`);this.roomStatus()});net.on('data',(peer,m)=>this.onNetData(peer,m));net.on('left',peer=>{this.log(`P${peer+1} LEFT`);if(this.session)this.session.peerLeft(peer);else if(this.net.id===this.net.host&&this.lobby){const slot=this.lobby.slots.find(s=>s.id===peer);if(slot){slot.kind='open';slot.ready=false}this.sendLobby();this.render()}});if(host)await net.create();else if(options.mode==='manual'){const answer=await net.acceptInvitation(code);this.showAnswer(answer)}else await net.join(code)}catch(e){this.toast('\u8fde\u63a5\u5931\u8d25\uff1a'+e.message,true);this.net?.close();this.net=null;this.page='network';this.render()}}
 membersChanged(members){if(!this.net)return;if(this.net.id===this.net.host&&this.lobby){for(const m of members){const slot=this.lobby.slots.find(s=>s.id===m.id);if(slot){slot.kind='human';slot.name=m.name;if(m.id===this.net.id){slot.race=this.profile.race;slot.ready=true}else if(!slot.humanSeen){slot.ready=false;slot.humanSeen=true}}}for(const slot of this.lobby.slots)if(slot.kind==='human'&&!members.some(m=>m.id===slot.id)){slot.kind='open';slot.ready=false}this.sendLobby()}if(!this.session){this.page='room';this.render()}}
 sendLobby(){if(!this.net||this.net.id!==this.net.host||!this.lobby)return;this.lobby.rev++;this.net.broadcast({kind:'lobby',op:'state',config:this.lobby});this.roomStatus()}
 sendProfile(ready=null,race=null){if(!this.net)return;const data={kind:'lobby',op:'profile',name:this.profile.name,race:race||this.profile.race};if(ready!==null)data.ready=ready;if(this.net.id===this.net.host)this.onNetData(this.net.id,data);else this.net.send(this.net.host,data)}
 onNetData(peer,m){if(!this.net||!m)return;if(m.kind==='chat'){if(typeof m.text!=='string')return;const text=m.text.slice(0,180),name=this.lobby?.slots.find(s=>s.id===peer)?.name||this.net.members.get(peer)?.name||`P${peer+1}`;if(this.session)this.session.addChat(name,text,peer);else{this.roomChat.push({name,text});this.roomChat=this.roomChat.slice(-20);this.roomStatus()}return}if(m.kind!=='lobby')return;if(m.op==='state'&&peer===this.net.host){if(!m.config?.slots||m.config.slots.length!==4||!MISSIONS[m.config.mission])return;this.lobby=clone(m.config);if(!this.session)this.render()}else if(m.op==='profile'&&this.net.id===this.net.host&&this.lobby){const s=this.lobby.slots.find(s=>s.id===peer&&s.kind==='human');if(!s)return;s.name=String(m.name||s.name).slice(0,24);if(RACE_CONFIG[m.race])s.race=m.race;if(typeof m.ready==='boolean')s.ready=m.ready;this.sendLobby();if(!this.session)this.render()}else if(m.op==='prepare'&&peer===this.net.host){this.prepare(m.config,false)}else if(m.op==='loaded'&&this.net.id===this.net.host&&this.pendingStart){this.loaded.set(peer,m.digest);this.tryGo()}else if(m.op==='go'&&peer===this.net.host&&this.session){this.session.schedule(m.at);this.pendingStart=false;this.closeModal()}else if(m.op==='cancel-start'&&peer===this.net.host){this.returnLobby();this.toast('\u90e8\u7f72\u5df2\u53d6\u6d88\uff0c\u8bf7\u786e\u4fdd\u5404\u7aef\u4f7f\u7528\u76f8\u540c\u7248\u672c',true)}else if(m.op==='return'&&peer===this.net.host){this.returnLobby()}else if(m.op==='handoff'&&peer===this.session?.world.coordinator){this.session.world.acceptHandoff(peer,m);this.net.host=m.next;this.toast(`P${m.next+1} \u5df2\u63a5\u7ba1\u623f\u95f4\u4e0e Bot`)} }
 roomPage(){const n=this.net;if(!n)return this.networkPage();const l=this.lobby,host=n.id===n.host;if(!l)return`${this.title('ESTABLISHING CONNECTION','\u6b63\u5728\u63a5\u5165\u4f5c\u6218\u7f51\u7edc','\u7b49\u5f85\u623f\u4e3b\u4f20\u6765\u90e8\u7f72\u914d\u7f6e\u3002')}<div class="panel"><p>\u8fde\u63a5\u5c06\u4f7f\u7528 WebRTC \u52a0\u5bc6\u6570\u636e\u901a\u9053\u3002\u624b\u52a8\u6a21\u5f0f\u8bf7\u5148\u5c06\u5e94\u7b54\u7801\u53d1\u7ed9\u623f\u4e3b\u3002</p><div id="matrixRoot"></div><button class="btn" data-action="leave-room">\u8fd4\u56de</button></div>`;return`${this.title('LOBBY / '+(host?'COORDINATOR':'PEER '+(n.id+1)),'\u4f5c\u6218\u51c6\u5907\u5ba4','\u6240\u6709\u73a9\u5bb6\u5c31\u7eea\u4e14\u5168\u90e8\u76f4\u8fde\u5efa\u7acb\u540e\uff0c\u624d\u80fd\u5f00\u59cb\u90e8\u7f72\u3002',n.mode==='manual'?'MANUAL SIGNALING':'FULL MESH')}<div class="room-footer" style="margin:-6px 0 22px"><div><span class="muted" style="font-size:10px">ROOM ID &nbsp;</span><span class="room-code">${safeText(n.room)}</span><button class="btn small ghost" data-action="copy-room">\u590d\u5236</button></div><button class="btn small ghost" data-action="leave-room">\u79bb\u5f00\u623f\u95f4</button></div><div class="room-layout"><div><div class="seat-grid">${l.slots.map(s=>this.seatCard(s,host)).join('')}</div><div class="section-head"><h3>\u4f5c\u6218\u914d\u7f6e</h3><span>${host?'\u53d8\u66f4\u914d\u7f6e\u540e\u9700\u91cd\u65b0\u51c6\u5907':'\u7531\u623f\u4e3b\u8bbe\u7f6e'}</span></div><div class="settings-line" style="margin-top:0"><div class="field"><label>\u4efb\u52a1</label><select id="roomMission" ${host?'':'disabled'}>${Object.keys(MISSIONS).map(id=>this.option(id,MISSION_COPY[id][1],l.mission)).join('')}</select></div><div class="field"><label>\u89c4\u5219</label><select id="roomRules" ${host&&l.mission==='skirmish'?'':'disabled'}>${this.option('ffa','\u5404\u81ea\u4e3a\u6218',l.rules)}${this.option('teams','2v2 / 1+3 vs 2+4',l.rules)}${this.option('coop','\u5168\u4f53\u4eba :7px"><input id="roomMessage" maxlength="180" placeholder="\u8f93\u5165\u6d88\u606f\u540e\u70b9\u53d1\u9001"></div><button class="btn small ghost" data-action="room-chat" style="margin-top:7px;width:100%">\u53d1\u9001\u6d88\u606f</button></aside></div>`}
 seatCard(s,host){const own=s.id===this.net.id,human=s.kind==='human',editRace=own||host&&!human;return`<div class="seat ${s.kind==='open'||s.kind==='closed'?'empty':''}" style="--seat-color:${hex(TEAM_COLORS[s.id])}"><div class="seat-head"><span class="seat-id">P${s.id+1} ${own?' / YOU':''}</span><small class="${human&&s.ready?'ready':''}">${human?(s.ready?'\u5df2\u51c6\u5907':'\u51c6\u5907\u4e2d'):s.kind==='bot'?'HOST BOT':'OPEN SLOT'}</small></div><div class="seat-name">${safeText(human?s.name:s.kind==='bot'?`BOT ${s.id}`:'\u7b49\u5f85\u6307\u6325\u5b98')}</div><div style="display:flex;gap:8px;margin-top:11px"><div class="field"><select data-seat-race="${s.id}" ${editRace?'':'disabled'}>${Object.keys(RACE_CONFIG).map(r=>this.option(r,RACE_SHORT[r],s.race)).join('')}</select></div>${host&&!human?`<div class="field" style="min-width:76px"><select data-seat-kind="${s.id}">${this.option('open','\u7a7a\u4f4d',s.kind)}${this.option('bot','Bot',s.kind)}</select></div>`:''}</div></div>`}
 matrixHTML(){const n=this.net;if(!n)return'';const ids=[...n.members.keys()].sort((a,b)=>a-b);return`<table class="matrix" aria-label="\u8282\u70b9\u8fde\u63a5\u77e9\u9635"><thead><tr><th></th>${ids.map(id=>`<th>P${id+1}</th>`).join('')}</tr></thead><tbody>${ids.map(a=>`<tr><th>P${a+1}</th>${ids.map(b=>{if(a===b)return'<td>\u2014</td>';const ok=a===n.id?n.isOpen(b):b===n.id?n.isOpen(a):n.peers.get(a)?.links.includes(b);return`<td class="${ok?'ok':'wait'}" title="${ok?'\u76f4\u8fde\u5c31\u7eea':'\u5efa\u7acb\u8fde\u63a5\u4e2d'}">${ok?'\u2713':'\u00b7'}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}
 roomStatus(){if(!this.net)return;const n=this.net,root=document.getElementById('matrixRoot');if(root)root.innerHTML=this.matrixHTML();const status=document.getElementById('meshStatus');if(status){const ids=[...n.members.keys()],ready=ids.filter(id=>id!==n.id&&n.isOpen(id)).length,latency=[...n.peers.values()].filter(p=>n.isOpen(p.id)).map(p=>Math.round(p.rtt));status.textContent=`${ready}/${Math.max(0,ids.length-1)} \u6761\u672c\u673a\u76f4\u8fde\u5c31\u7eea${latency.length?' / RTT '+latency.join(' / ')+' ms':''}\n${n.fullyMeshed()?'\u5168\u4e92\u8054\u68c0\u67e5\u901a\u8fc7':'\u7b49\u5f85\u6240\u6709\u8282\u70b9\u4e92\u76f8\u76f4\u8fde'}`}const log=document.getElementById('networkLog');if(log)log.textContent=this.logs.slice(-4).join('\n');const human=this.lobby?.slots.filter(s=>s.kind==='human')||[],allReady=human.every(s=>s.ready),start=document.getElementById('startMatch');if(start){start.disabled=!allReady||!n.fullyMeshed()||n.members.size<2||this.pendingStart;start.title=n.members.size<2?'\u8054\u673a\u9700\u8981\u81f3\u5c11\u4e24\u4f4d\u73a9\u5bb6\uff1b\u5355\u4eba\u8bf7\u4f7f\u7528\u5355\u4eba\u884c\u52a8':!allReady?'\u7b49\u5f85\u6240\u6709\u73a9\u5bb6\u51c6\u5907':!n.fullyMeshed()?'\u7b49\u5f85\u5168\u90e8\u76f4\u8fde':''}const ready=document.getElementById('readySummary');if(ready)ready.textContent=`${human.filter(s=>s.ready).length}/${human.length} \u4f4d\u6307\u6325\u5b98\u5c31\u7eea\u3000${this.lobby?.slots.filter(s=>s.kind==='bot').length||0} \u4f4d Bot`;const chat=document.getElementById('lobbyChat');if(chat&&this.roomChat.length){chat.innerHTML=this.roomChat.slice(-8).map(m=>`<div><b>${safeText(m.name)}</b> &nbsp;${safeText(m.text)}</div>`).join('');chat.scrollTop=chat.scrollHeight}}
 async invite(){if(!this.net)return;this.modal('\u9080\u8bf7\u65b0\u6307\u6325\u5b98','<div class="note">\u6b63\u5728\u6536\u96c6 ICE \u8fde\u63a5\u4fe1\u606f\u2026</div>');try{const code=await this.net.invitation();this.inviteCode=code;this.modal('\u9080\u8bf7\u65b0\u6307\u6325\u5b98',`<div class="note">\u5c06\u4e0b\u9762\u7684\u9080\u8bf7\u7801\u53d1\u7ed9\u4e00\u4f4d\u73a9\u5bb6\u3002\u5bf9\u65b9\u5728\u201c\u52a0\u5165\u623f\u95f4\u201d\u7c98\u8d34\u540e\u4f1a\u751f\u6210\u5e94\u7b54\u7801\uff0c\u518d\u53d1\u56de\u8fd9\u91cc\u3002\u8bf7\u4e0d\u8981\u628a\u540c\u4e00\u9080\u8bf7\u7801\u53d1\u7ed9\u591a\u4eba\u3002</div><div class="field"><label>\u9080\u8bf7\u7801</label><textarea id="inviteOut" readonly>${safeText(code)}</textarea></div><button class="btn small" data-action="copy-invite" style="margin:10px 0 18px">\u590d\u5236\u9080\u8bf7\u7801</button><div class="field"><label>\u7c98\u8d34\u73a9\u5bb6\u8fd4\u56de\u7684\u5e94\u7b54\u7801</label><textarea id="answerIn" placeholder="VF2. ..."></textarea></div>`,`<button class="btn ghost" data-action="cancel-invites">\u64a4\u9500\u672a\u4f7f\u7528\u9080\u8bf7</button><button class="btn primary" data-action="accept-answer">\u5b8c\u6210\u914d\u5bf9</button>`)}catch(e){this.closeModal();this.toast(e.message,true)}}
 showAnswer(answer){this.answerCode=answer;this.modal('\u628a\u5e94\u7b54\u53d1\u56de\u623f\u4e3b',`<div class="note">\u8bf7\u590d\u5236\u5b8c\u6574\u5e94\u7b54\u7801\u53d1\u7ed9\u623f\u4e3b\u3002\u623f\u4e3b\u7c98\u8d34\u786e\u8ba4\u540e\uff0c\u5176\u4ed6\u8282\u70b9\u4f1a\u81ea\u52a8\u5168\u4e92\u8054\u3002</div><div class="field"><textarea readonly id="answerOut">${safeText(answer)}</textarea></div>`,`<button class="btn primary" data-action="copy-answer">\u590d\u5236\u5e94\u7b54\u7801</button><button class="btn" data-action="close-modal">\u5df2\u53d1\u9001\uff0c\u8fd4\u56de\u5927\u5385</button>`)}
 async copy(text,selector=null){try{await navigator.clipboard.writeText(text);this.toast('\u5df2\u590d\u5236')}catch{const field=selector?document.querySelector(selector):null;if(field){field.focus();field.select();document.execCommand('copy');this.toast('\u5185\u5bb9\u5df2\u9009\u4e2d\uff0c\u53ef\u6309 Ctrl+C \u590d\u5236')}else this.modal('\u590d\u5236\u5185\u5bb9',`<div class="field"><input value="${safeText(text)}" onclick="this.select()" readonly></div>`)}}
 async startSolo(){this.captureFields();if(this.net){this.toast('\u8bf7\u5148\u79bb\u5f00\u8054\u673a\u623f\u95f4',true);return}const slots=this.slotDefaults().slice(0,this.soloBots+1).map((s,i)=>({...s,kind:i===0?'human':'bot'}));if(this.config.rules==='teams'&&slots.length<2){this.toast('\u81f3\u5c11\u9700\u8981\u4e24\u4e2a\u9635\u8425',true);return}const config={...clone(this.config),slots,match:uid(),seed:Math.floor(Math.random()*2**31)};this.lastSolo=config;this.session=new GameSession(this,config,null);this.session.schedule(Date.now()+300)}
 startMatch(){if(!this.net||this.net.id!==this.net.host||!this.net.fullyMeshed())return;const humans=this.lobby.slots.filter(s=>s.kind==='human');if(humans.some(s=>!s.ready)||humans.length<2)return;const config={...clone(this.lobby),match:uid(),seed:Math.floor(Math.random()*2**31)};const active=config.slots.filter(s=>s.kind==='human'||s.kind==='bot');if(config.mission==='skirmish'&&config.rules==='teams'&&new Set(active.map(s=>s.id%2)).size<2){this.toast('\u7ec4\u961f\u6a21\u5f0f\u9700\u8981\u4e24\u652f\u654c\u5bf9\u961f\u4f0d',true);return}this.pendingStart=true;this.loaded.clear();if(this.net.ws?.readyState===1)this.net.ws.send(JSON.stringify({op:'lock',locked:true}));this.net.broadcast({kind:'lobby',op:'prepare',config});this.prepare(config,true);this.prepareTimeout=setTimeout(()=>{if(this.pendingStart){this.net?.broadcast({kind:'lobby',op:'cancel-start'});this.returnLobby();this.toast('\u540c\u6b65\u90e8\u7f72\u8d85\u65f6\uff0c\u8bf7\u68c0\u67e5\u8fde\u63a5\u540e\u91cd\u8bd5',true)}},15000)}
 prepare(config,host){try{if(this.session)this.session.destroy();this.closeModal();this.session=new GameSession(this,config,this.net);const digest=this.session.digest();if(host){this.loaded.set(this.net.id,digest);this.tryGo()}else this.net.send(this.net.host,{kind:'lobby',op:'loaded',digest})}catch(e){console.error(e);this.toast('\u90e8\u7f72\u5931\u8d25\uff1a'+e.message,true)}}
 tryGo(){if(!this.pendingStart||!this.session)return;const ids=[...this.net.members.keys()];if(!ids.every(id=>this.loaded.has(id)))return;const digests=[...this.loaded.values()];if(new Set(digests).size!==1){this.net.broadcast({kind:'lobby',op:'cancel-start'});this.returnLobby();this.toast('\u5730\u56fe\u6216\u89c4\u5219\u6821\u9a8c\u4e0d\u4e00\u81f4\uff0c\u62d2\u7edd\u5f00\u5c40',true);return}const at=Date.now()+1400;this.net.broadcast({kind:'lobby',op:'go',at});this.session.schedule(at);this.pendingStart=false;clearTimeout(this.prepareTimeout)}
 returnLobby(){clearTimeout(this.prepareTimeout);this.pendingStart=false;this.closeModal();this.session?.destroy();this.session=null;if(this.net){this.page='room';if(this.net.id===this.net.host&&this.lobby){for(const s of this.lobby.slots)if(s.kind==='human')s.ready=s.id===this.net.id;if(this.net.ws?.readyState===1)this.net.ws.send(JSON.stringify({op:'lock',locked:false}));this.sendLobby()}}else this.page='solo';this.render()}
 leaveRoom(){if(this.session){this.session.leave();return}this.net?.close();this.net=null;this.lobby=null;this.page='network';this.closeModal();this.render()}
 guidePage(){return`${this.title('FIELD MANUAL / 03','\u6307\u6325\u5b98\u4f5c\u6218\u624b\u518c','\u4ece\u4e00\u4e2a\u91c7\u77ff\u6307\u4ee4\uff0c\u5230\u4e00\u6b21\u56db\u65b9\u534f\u540c\u3002','TACTICAL REFERENCE')}<div class="guide-grid"><section class="panel"><div class="eyebrow">01 / CONTROL</div><h3>\u57fa\u7840\u6307\u6325</h3><p>\u5de6\u952e\u70b9\u9009\uff0c\u62d6\u62fd\u6846\u9009\u3002\u53cc\u51fb\u9009\u4e2d\u5c4f\u5e55\u5185\u540c\u7c7b\u5355\u4f4d\u3002\u53f3\u952e\u81ea\u52a8\u5224\u65ad\u79fb\u52a8\u3001\u653b\u51fb\u3001\u91c7\u96c6\u3001\u4fee\u7406\u3001\u88c5\u8f7d\u6216\u7ee7\u7eed\u5efa\u9020\u3002</p><p><span class="key">A</span>\u653b\u51fb\u79fb\u52a8 <span class="key">M</span>\u79fb\u52a8 <span class="key">S</span>\u505c\u6b62<br><span class="key">H</span>\u539f\u5730\u9632\u5b88 <span class="key">P</span>\u5de1\u903b <span class="key">B</span>\u5efa\u9020</p><p><span class="key">Shift</span>\u8ffd\u52a0\u6307\u4ee4 / \u8ffd\u52a0\u9009\u62e9\u3002<span class="key">Esc</span>\u53d6\u6d88\u5f53\u524d\u6a21\u5f0f\u3002</p></section><section class="panel"><div class="eyebrow">02 / AWARENESS</div><h3>\u89c6\u91ce\u4e0e\u7f16\u961f</h3><p>\u65b9\u5411\u952e\u3001\u8fb9\u7f18\u6eda\u5c4f\u6216\u9f20\u6807\u4e2d\u952e\u62d6\u62fd\u79fb\u52a8\u955c\u5934\uff0c\u6eda\u8f6e\u7f29\u653e\u3002\u5c0f\u5730\u56fe\u5de6\u952e\u79fb\u955c\uff0c\u53f3\u952e\u4e0b\u4ee4\uff0cAlt+\u70b9\u51fb\u53d1\u9001\u6218\u672f\u6807\u8bb0\u3002</p><p><span class="key">Ctrl+0\u20139</span>\u4fdd\u5b58\u7f16\u961f\uff0c\u6570\u5b57\u9009\u62e9\uff0c\u53cc\u6309\u5b9a\u4f4d\u3002<br><span class="key">F1</span>\u4e3b\u57fa\u5730 <span class="key">F2</span>\u4f5c\u6218\u90e8\u961f <span class="key">F3</span>\u7a7a\u95f2\u5de5\u4eba<br><span class="key">Space</span>\u6700\u8fd1\u8b66\u62a5 <span class="key">Enter</span>\u804a\u5929</p><p>WASD \u4e0d\u7528\u4e8e\u955c\u5934\uff0c\u907f\u514d\u4e0e\u653b\u51fb\u3001\u505c\u6b62\u5feb\u6377\u952e\u51b2\u7a81\u3002</p></section><section class="panel"><div class="eyebrow">03 / ECONOMY</div><h3>\u7ecf\u6d4e\u4e0e\u79d1\u6280</h3><p>\u77ff\u7269\u548c\u6c14\u4f53\u9700\u8981\u8fd0\u56de\u4e3b\u57fa\u5730\u624d\u4f1a\u5165\u8d26\u3002\u6c14\u6cc9\u5fc5\u987b\u5148\u5efa\u9020\u91c7\u96c6\u5efa\u7b51\uff0c\u6bcf\u5ea7\u6700\u591a\u4e09\u540d\u5de5\u4eba\u3002</p><p>\u961f\u5217\u4f1a\u9884\u5360\u4eba\u53e3\u3002\u70b9\u51fb\u751f\u4ea7\u961f\u5217\u53ef\u53d6\u6d88\uff1a\u672a\u5f00\u59cb\u5168\u989d\u9000\u8fd8\uff0c\u8fdb\u884c\u4e2d\u9000\u8fd8 75%\u3002\u5efa\u9020\u53d6\u6d88\u9000\u8fd8 75%\u3002</p><p>\u4eba\u7c7b\u9700\u6301\u7eed\u65bd\u5de5\uff1b\u661f\u7075\u653e\u7f6e\u4fe1\u6807\u540e\u81ea\u52a8\u6298\u8dc3\uff1b\u5f02\u866b\u727a\u7272\u5de5\u8702\u5b75\u5316\u3002\u9644\u5c5e\u79d1\u6280\u3001\u53cc\u751f\u4ea7\u69fd\u3001\u80fd\u91cf\u573a\u3001\u83cc\u6bef\u548c\u5e7c\u866b\u5747\u6709\u5b9e\u9645\u89c4\u5219\u3002</p></section><section class="panel"><div class="eyebrow">04 / MULTIPLAYER</div><h3>\u56db\u65b9\u76f4\u8fde\u4e0e\u8fde\u63a5\u8fb9\u754c</h3><p>\u623f\u4e3b\u63d0\u4f9b Bot \u4e0e\u5927\u5385\u534f\u8c03\uff0c\u4e0d\u8f6c\u53d1\u6218\u6597\u3002A \u653b\u51fb B \u65f6\uff0cA \u751f\u6210\u653b\u51fb\uff0cB \u7ed3\u7b97\u81ea\u5df1\u7684\u62a4\u76fe\u3001\u751f\u547d\u4e0e\u6b7b\u4ea1\uff0cC/D \u4ec5\u63a5\u6536\u7ed3\u679c\u3002</p><p>\u961f\u53cb\u5171\u4eab\u89c6\u91ce\uff0c\u4f46\u4e0d\u80fd\u64cd\u4f5c\u961f\u53cb\u519b\u961f\u3002\u8054\u673a\u6253\u5f00\u83dc\u5355\u4e0d\u4f1a\u6682\u505c\u5bf9\u5c40\u3002\u8bf7\u4e0d\u8981\u5237\u65b0\u6216\u5173\u95ed\u5bf9\u5c40\u9875\u9762\u3002</p><p>\u8fd9\u662f\u9762\u5411\u4e92\u4fe1\u73a9\u5bb6\u7684 P2P \u5bf9\u5c40\uff0c\u4e0d\u662f\u7ade\u6280\u7ea7\u53cd\u4f5c\u5f0a\u7cfb\u7edf\u3002\u672c\u7248\u4e0d\u652f\u6301\u5237\u65b0\u540e\u6062\u590d\u6216\u5bf9\u5c40\u4e2d\u9014\u52a0\u5165\u3002</p></section></div><div class="note">\u6280\u80fd\u683c\u4f1a\u660e\u786e\u663e\u793a\u8d44\u6e90\u3001\u80fd\u91cf\u3001\u51b7\u5374\u4e0e\u79d1\u6280\u524d\u7f6e\u3002\u6309\u94ae\u53d1\u7070\u65f6\uff0c\u60ac\u505c\u5373\u53ef\u67e5\u770b\u539f\u56e0\u3002</div>`}
 codexPage(){const race=this.codexRace||this.profile.race,kind=this.codexKind||'units',list=Object.values(kind==='units'?UNIT_DEFS:BUILDING_DEFS).filter(d=>d.race===race);return`${this.title('INTELLIGENCE / 04','\u5355\u4f4d\u4e0e\u79d1\u6280\u56fe\u9274','\u5b9e\u9645\u5bf9\u5c40\u7684\u5175\u79cd\u6570\u636e\u3001\u80fd\u529b\u548c\u524d\u7f6e\u6761\u4ef6\u3002','LIVE RULES CATALOG')}<div class="codex-toolbar"><div class="field"><label>\u9635\u8425</label><select id="codexRace">${Object.keys(RACE_CONFIG).map(r=>this.option(r,RACE_SHORT[r],race)).join('')}</select></div><div class="field"><label>\u5206\u7c7b</label><select id="codexKind">${this.option('units','\u5355\u4f4d',kind)}${this.option('buildings','\u5efa\u7b51',kind)}</select></div></div><div class="codex-grid">${list.map(d=>`<article class="codex-card"><h4>${d.name}</h4><small>HP ${d.hp} ${d.shield?' / SH '+d.shield:''} &nbsp; M ${d.mineral} / G ${d.gas}</small><p>${d.description}</p><div class="small-text">${(d.abilities||[]).map(id=>ABILITY_DEFS[id]?.name||id).join(' / ')||'\u65e0\u4e3b\u52a8\u6280\u80fd'}</div>${(UNIT_REQUIREMENTS[d.id]||d.requires||[]).length?`<p>\u524d\u7f6e\uff1a${(UNIT_REQUIREMENTS[d.id]||d.requires).map(id=>BUILDING_DEFS[id]?.name||id).join(' / ')}</p>`:''}</article>`).join('')}</div>`}
 async click(e){const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='close-modal'){this.closeModal();return}if(this.session&&this.session.handleAction(action,b))return;try{switch(action){case'nav':if(this.net&&b.dataset.page==='network')this.page='room';else this.page=b.dataset.page;this.render();break;case'mission':this.config.mission=b.dataset.value;this.render();break;case'race':this.profile.race=b.dataset.value;this.save();this.render();break;case'solo-start':await this.startSolo();break;case'create-room':b.disabled=true;await this.createRoom();break;case'join-room':b.disabled=true;await this.joinRoom();break;case'leave-room':this.leaveRoom();break;case'copy-room':this.copy(this.net.room);break;case'ready':this.sendProfile(!this.lobby.slots[this.net.id].ready);break;case'start-match':this.startMatch();break;case'invite':await this.invite();break;case'copy-invite':this.copy(this.inviteCode,'#inviteOut');break;case'copy-answer':this.copy(this.answerCode,'#answerOut');break;case'answer-paste':this.modal('\u7c98\u8d34\u73a9\u5bb6\u5e94\u7b54','<div class="field"><textarea id="answerIn" placeholder="VF2. ..."></textarea></div>','<button class="btn primary" data-action="accept-answer">\u5b8c\u6210\u914d\u5bf9</button>');break;case'accept-answer':await this.net.acceptAnswer(document.getElementById('answerIn').value);this.closeModal();this.toast('\u5e94\u7b54\u5df2\u63a5\u6536\uff0c\u6b63\u5728\u5efa\u7acb\u76f4\u8fde');break;case'cancel-invites':this.net.cancelInvitations();this.closeModal();break;case'room-chat':{const field=document.getElementById('roomMessage'),text=field.value.trim().slice(0,180);if(text){this.net.broadcast({kind:'chat',text});this.roomChat.push({name:this.profile.name,text});field.value='';this.roomStatus()}break}}}catch(error){console.error(error);this.toast(error.message,true);if(b.isConnected)b.disabled=false}}
 change(e){const el=e.target;this.captureFields();if(el.id==='soloRules')this.config.rules=el.value;else if(el.id==='soloBots')this.soloBots=Number(el.value);else if(el.id==='difficulty')this.config.difficulty=el.value;else if(el.id==='holdMinutes')this.config.holdMinutes=Number(el.value);else if(el.id==='netMode')this.render();else if(el.id==='codexRace'){this.codexRace=el.value;this.render()}else if(el.id==='codexKind'){this.codexKind=el.value;this.render()}else if(el.dataset.seatRace){const id=Number(el.dataset.seatRace);if(id===this.net.id){this.profile.race=el.value;this.save();this.sendProfile(false,el.value)}else if(this.net.id===this.net.host){this.lobby.slots[id].race=el.value;this.configChanged()}}else if(el.dataset.seatKind&&this.net.id===this.net.host){this.lobby.slots[Number(el.dataset.seatKind)].kind=el.value;this.configChanged()}else if(this.net?.id===this.net?.host&&this.lobby){const map={roomMission:'mission',roomRules:'rules',roomDifficulty:'difficulty',roomHold:'holdMinutes'};if(map[el.id]){this.lobby[map[el.id]]=el.id==='roomHold'?Number(el.value):el.value;this.configChanged()}}if(this.session)this.session.handleChange(el)}
 configChanged(){for(const s of this.lobby.slots)if(s.kind==='human')s.ready=s.id===this.net.id;this.sendLobby();this.render()}
}
